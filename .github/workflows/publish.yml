name: publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        run: |
          VERSION=$(python -c "exec(open('src/accuclass_client/_version.py').read()); print(__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package version: $VERSION, release tag: $GITHUB_REF_NAME"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $VERSION"
            exit 1
          fi

      - name: Check no placeholders are left
        run: |
          if grep -rn "GITHUB-USERNAME" pyproject.toml README.md; then
            echo "::error::Replace GITHUB-USERNAME with your GitHub username first"
            exit 1
          fi

      - name: Build
        run: |
          python -m pip install build
          python -m build

      - name: Test the built wheel
        run: |
          python -m pip install dist/*.whl
          python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
